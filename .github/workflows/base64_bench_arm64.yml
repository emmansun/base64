name: base64-bench-arm64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base64-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Base64 benchmark (arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Get CPU info
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          {
            echo "=== CPU Information ==="
            uname -a
            echo ""
            echo "=== Processor Details ==="
            lscpu || true
            echo ""
            echo "=== /proc/cpuinfo ==="
            cat /proc/cpuinfo || true
          } | tee .artifacts/cpu-info.txt

      - name: Run BASE64 benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          go test -run '^$' -bench . -benchmem -benchtime=300ms ./... | tee .artifacts/base64-bench.txt

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: base64-bench-${{ github.run_id }}
          path: .artifacts/
