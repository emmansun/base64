# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: ppc64le-qemu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    strategy:
      matrix:
        go-version: [1.25.x]
        # power8: IsPOWER9=false → exercises P8 code paths (VMSUMUHM WORD, LXVD2X+VPERM, XXPERMDI+STXVD2X)
        # power9: IsPOWER9=true  → exercises P9 code paths (LXVB16X, STXVB16X)
        qemu_cpu: [power8, power9]
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Check out code
      uses: actions/checkout@v5

    - name: Test (${{ matrix.qemu_cpu }})
      run: go test -v ./...
      env:
        GOARCH: ppc64le
        QEMU_CPU: ${{ matrix.qemu_cpu }}
