# QEMU user-mode supports ppc64 big-endian via qemu-ppc64-static from apt.
# docker/setup-qemu-action only covers ppc64le, so we install qemu-user-static
# directly, which registers binfmt_misc for big-endian PowerPC 64-bit ELF binaries.

name: ppc64-qemu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  test:
    strategy:
      matrix:
        go-version: [1.26.x]
        # power8: IsPOWER9=false → exercises P8 code paths
        # power9: IsPOWER9=true  → exercises P9 code paths (LXVB16X == LXVD2X on BE,
        #         encodeP9Asm BE still uses VPERM+STXVD2X same as P8)
        qemu_cpu: [power8, power9]
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Set up QEMU (ppc64 big-endian)
      # docker/setup-qemu-action only supports ppc64le; install qemu-user for
      # qemu-ppc64 and qemu-user-binfmt to register big-endian PowerPC 64-bit
      # ELF binaries. qemu-user-static is virtual on newer Ubuntu releases.
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y qemu-user qemu-user-binfmt

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Test (${{ matrix.qemu_cpu }})
      run: go test -v ./...
      env:
        GOARCH: ppc64
        GOOS: linux
        QEMU_CPU: ${{ matrix.qemu_cpu }}
