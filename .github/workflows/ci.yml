name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goVer: ['1.26']
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: Checkout Repo
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
  
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.goVer }}
       
    - name: Test
      run: go test  -coverprofile=coverage1.txt ./...

    - name: Test Generic
      run: go test -tags purego -coverprofile=coverage2.txt ./...      

    - name: Upload results to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        files: ./coverage1.txt,./coverage2.txt
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # AVX512 VBMI tests run on a separate job.
  # GitHub-hosted ubuntu-latest runners do not guarantee AVX512 VBMI support.
  # AVX512-specific tests use t.Skip when the CPU feature is absent, so this
  # job never fails on unsupported hardware — it just reports skipped tests.
  # For full AVX512 VBMI coverage see amd64_avx512_sde.yml (Intel SDE emulator).
  avx512:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goVer: ['1.26']
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: Checkout Repo
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.goVer }}

    - name: Print CPU flags
      run: grep -m1 'flags' /proc/cpuinfo | tr ' ' '\n' | grep -E 'avx512' || echo "No AVX512 flags found"

    - name: Test AVX512 (skips gracefully if CPU lacks AVX512 VBMI)
      run: go test -v -run 'AVX512' ./...

    - name: Benchmark AVX512 (skips gracefully if CPU lacks AVX512 VBMI)
      run: go test -v -bench 'AVX512' -benchtime=1x -run '^$' ./...

